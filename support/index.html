<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FFF4EE" />
  <title>DayZero — Support</title>
  <style>
    body {
      background: #FFF4EE; color: #5D5D5D;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 60px 20px; text-align: center; font-size: 14px;
    }
    a { color: #FF5E5B; text-decoration: none; padding: 0 8px; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
  <script>
    var lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
    var supported = ['en', 'it', 'de', 'fr', 'es'];
    var target = supported.indexOf(lang) >= 0 ? lang : 'en';
    window.location.replace('./' + target + '/');
  </script>
</head>
<body>
  <p>Redirecting…</p>
  <noscript>
    <p style="margin-top: 24px;">JavaScript disabled — pick your language:</p>
    <p>
      <a href="./en/">English</a>·
      <a href="./it/">Italiano</a>·
      <a href="./de/">Deutsch</a>·
      <a href="./fr/">Français</a>·
      <a href="./es/">Español</a>
    </p>
  </noscript>
</body>
</html>
